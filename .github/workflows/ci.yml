name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build
        run: ./gradlew assemble

      - name: Test
        run: ./gradlew test

      - name: Check public API surface
        run: ./gradlew apiCheck

      # The demo is a standalone Gradle build consuming RoomQL as published artifacts.
      # Publishing locally first means CI verifies the documented install path, not just
      # that the code compiles.
      # Published under the exact version demo/gradle/libs.versions.toml asks for, so
      # mavenLocal() satisfies it. Keep the two in step if the demo's roomql version moves.
      - name: Publish library to Maven local
        run: VERSION=1.0.0 ./gradlew publishToMavenLocal

      # RoomQL promises consumers they need no keep rules. That holds only while the
      # published artifacts stay free of reflection and name derivation, so it is checked
      # against the real jar and aar rather than asserted in the README.
      - name: Verify no reflection in published artifacts
        run: ./scripts/verify-no-reflection.sh 1.0.0

      - name: Build demo app
        run: ./gradlew -p demo assembleDebug

      - name: Test demo app
        run: ./gradlew -p demo testDebugUnitTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'
