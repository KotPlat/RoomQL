name: Release

# Publishes runtime, runtime-android, and ksp-processor to Maven Central via the
# Sonatype Central Portal. Triggered by pushing a version tag (e.g. `1.0.0`); the tag
# name becomes the published version. workflow_dispatch exists as a manual fallback,
# letting a version be re-run or dry-run tested without pushing a new tag.
#
# The upload lands the bundle in "pending" state — someone still has to open
# https://central.sonatype.com/publishing/deployments and click Release by hand. This
# is deliberate: a bad publish to Central is effectively permanent, so the last step
# stays a human decision. See issue #65 for the Central Portal account/token setup this
# workflow depends on.

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (defaults to the current tag/ref name)'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # A tag push names the version via GITHUB_REF_NAME; workflow_dispatch can override
      # it explicitly for a manual re-run. Central Portal versions are immutable once
      # released, so this is the one place the version is decided — everything after
      # this step just uses $VERSION.
      - name: Resolve version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION"

      # Signing activates automatically inside each module's build.gradle.kts once
      # ORG_GPG_KEY/ORG_GPG_PASSPHRASE are present — see issue #64.
      - name: Build, sign, and publish to a local staging repository
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ORG_GPG_KEY: ${{ secrets.ORG_GPG_KEY }}
          ORG_GPG_PASSPHRASE: ${{ secrets.ORG_GPG_PASSPHRASE }}
        run: ./gradlew publishToMavenLocal

      # Central Portal's upload API expects a zip of the plain Maven repository layout
      # (groupId/artifactId/version/*) with a checksum alongside every file. It does not
      # want Gradle's local-only maven-metadata-local.xml files.
      - name: Assemble the Central Portal deployment bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          BUNDLE_ROOT="$(mktemp -d)"
          STAGING="$BUNDLE_ROOT/io/github/kotplat/roomql"
          SOURCE="$HOME/.m2/repository/io/github/kotplat/roomql"

          # Only the per-version files are copied, so Gradle's local-only
          # maven-metadata-local.xml (one level up, at $SOURCE/$module/) is never included.
          for module in runtime runtime-android ksp-processor; do
            mkdir -p "$STAGING/$module/$VERSION"
            cp "$SOURCE/$module/$VERSION/"* "$STAGING/$module/$VERSION/"
          done

          find "$STAGING" -type f | while read -r file; do
            sha1sum "$file" | cut -d ' ' -f1 > "$file.sha1"
            md5sum "$file" | cut -d ' ' -f1 > "$file.md5"
          done

          (cd "$BUNDLE_ROOT" && zip -qr "$GITHUB_WORKSPACE/bundle.zip" io)
          echo "Bundle contents:"
          unzip -l bundle.zip

      - name: Upload to Central Portal (pending manual release)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_TOKEN: ${{ secrets.CENTRAL_PORTAL_TOKEN }}
        run: |
          set -euo pipefail
          AUTH="$(printf '%s:%s' "$CENTRAL_PORTAL_USERNAME" "$CENTRAL_PORTAL_TOKEN" | base64 -w0)"

          HTTP_STATUS="$(curl -sS -o response.txt -w '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $AUTH" \
            --form "bundle=@bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=RoomQL-$VERSION&publishingType=USER_MANAGED")"

          DEPLOYMENT_ID="$(cat response.txt)"
          echo "HTTP status: $HTTP_STATUS"
          echo "Deployment ID: $DEPLOYMENT_ID"

          if [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Central Portal upload failed (HTTP $HTTP_STATUS): $DEPLOYMENT_ID"
            exit 1
          fi

          {
            echo "### Maven Central deployment pending manual release"
            echo
            echo "Version \`$VERSION\` uploaded to the Central Portal as deployment \`$DEPLOYMENT_ID\`."
            echo
            echo "Review it and click **Release** at:"
            echo "https://central.sonatype.com/publishing/deployments"
          } >> "$GITHUB_STEP_SUMMARY"
